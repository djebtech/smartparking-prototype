<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SmartParking AI — Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:    #0F1E35;
    --blue:    #2563EB;
    --blue-h:  #1D4ED8;
    --bg:      #F1F5F9;
    --surface: #FFFFFF;
    --border:  #E2E8F0;
    --text-1:  #0F172A;
    --text-2:  #475569;
    --red:     #DC2626;
    --green:   #059669;
  }

  html, body {
    height: 100%;
    font-family: 'Inter', sans-serif;
  }

  body {
    background-color: var(--navy);
    background-image: radial-gradient(circle, rgba(255,255,255,0.055) 1px, transparent 1px);
    background-size: 28px 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border-radius: 16px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.40), 0 4px 16px rgba(0,0,0,0.20);
    padding: 40px 36px 32px;
    width: 100%;
    max-width: 420px;
    animation: fadeIn 0.45s cubic-bezier(0.22,1,0.36,1) both;
  }

  /* ── Header ── */
  .card-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-bottom: 32px;
  }

  .logo-wrap {
    width: 72px;
    height: 72px;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(37,99,235,0.25);
    border: 2px solid var(--border);
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .card-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: -0.3px;
  }

  .card-sub {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-2);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.2px;
    text-align: center;
  }

  /* ── Divider ── */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 0 0 28px;
  }

  /* ── Form ── */
  .form-group {
    margin-bottom: 18px;
  }

  label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-2);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 7px;
  }

  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-icon {
    position: absolute;
    left: 13px;
    font-size: 15px;
    pointer-events: none;
    line-height: 1;
  }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    height: 44px;
    padding: 0 44px 0 40px;
    border: 1.5px solid var(--border);
    border-radius: 9px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    color: var(--text-1);
    background: var(--bg);
    outline: none;
    transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
  }

  input[type="text"]:focus,
  input[type="password"]:focus {
    border-color: var(--blue);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
  }

  input.error-input {
    border-color: var(--red) !important;
    box-shadow: 0 0 0 3px rgba(220,38,38,0.12) !important;
  }

  .toggle-pw {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 15px;
    color: var(--text-2);
    padding: 4px;
    line-height: 1;
    transition: color 0.15s;
  }
  .toggle-pw:hover { color: var(--navy); }

  /* ── Error message ── */
  .error-msg {
    display: none;
    align-items: center;
    gap: 7px;
    background: #FEF2F2;
    border: 1px solid #FECACA;
    border-radius: 8px;
    padding: 9px 12px;
    margin-top: 16px;
    font-size: 13px;
    color: var(--red);
    font-weight: 500;
  }
  .error-msg.visible { display: flex; }

  /* ── Submit button ── */
  .btn-submit {
    width: 100%;
    height: 44px;
    margin-top: 24px;
    background: var(--blue);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    letter-spacing: 0.2px;
    position: relative;
    overflow: hidden;
    transition: background 0.18s, transform 0.12s, box-shadow 0.18s;
    box-shadow: 0 4px 14px rgba(37,99,235,0.30);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-submit:hover {
    background: var(--blue-h);
    box-shadow: 0 6px 20px rgba(37,99,235,0.40);
    transform: translateY(-1px);
  }

  .btn-submit:active { transform: translateY(0); }

  .btn-submit::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.18) 50%, transparent 70%);
    transform: translateX(-100%);
    transition: transform 0.55s;
  }
  .btn-submit:hover::after { transform: translateX(100%); }

  .btn-submit.loading {
    pointer-events: none;
    background: var(--blue-h);
  }

  /* ── Spinner ── */
  .spinner {
    display: none;
    width: 18px;
    height: 18px;
    border: 2.5px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  .btn-submit.loading .spinner { display: block; }
  .btn-submit.loading .btn-text { opacity: 0.7; }

  /* ── Success state ── */
  .btn-submit.success {
    background: var(--green);
    box-shadow: 0 4px 14px rgba(5,150,105,0.35);
    pointer-events: none;
  }

  /* ── Footer link ── */
  .footer-note {
    margin-top: 26px;
    text-align: center;
    font-size: 11.5px;
    color: var(--text-2);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.1px;
    opacity: 0.75;
    user-select: none;
  }

  /* ── Animations ── */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(22px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0)    scale(1); }
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    15%      { transform: translateX(-8px); }
    30%      { transform: translateX(7px); }
    45%      { transform: translateX(-6px); }
    60%      { transform: translateX(5px); }
    75%      { transform: translateX(-3px); }
    90%      { transform: translateX(2px); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .card.shake { animation: shake 0.55s cubic-bezier(0.36,0.07,0.19,0.97) both; }

  /* ── Mobile ── */
  @media (max-width: 480px) {
    body { padding: 16px; align-items: flex-start; padding-top: 48px; }
    .card { padding: 32px 24px 28px; }
    .card-title { font-size: 18px; }
  }
</style>
</head>
<body>

<div class="card" id="card">
  <!-- Header -->
  <div class="card-header">
    <div class="logo-wrap">
      <img src="/static/logo.jpeg" alt="SmartParking Logo"/>
    </div>
    <div>
      <div class="card-title">MADINA</div>
    </div>
    <div class="card-sub">Prototype De DOUNIA ET MANEL USTHB 2026</div>
  </div>

  <div class="divider"></div>

  <!-- Form -->
  <form id="loginForm" autocomplete="off" onsubmit="handleLogin(event)">

    <div class="form-group">
      <label for="username">Nom d'utilisateur</label>
      <div class="input-wrap">
        <span class="input-icon">👤</span>
        <input type="text" id="username" placeholder="Entrez votre identifiant" autocomplete="username"/>
      </div>
    </div>

    <div class="form-group">
      <label for="password">Mot de passe</label>
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input type="password" id="password" placeholder="Entrez votre mot de passe" autocomplete="current-password"/>
        <button type="button" class="toggle-pw" id="togglePw" onclick="togglePassword()" title="Afficher/Masquer">👁</button>
      </div>
    </div>

    <!-- Error -->
    <div class="error-msg" id="errorMsg">
      <span>⚠</span>
      <span id="errorText">Identifiants incorrects. Veuillez réessayer.</span>
    </div>

    <!-- Submit -->
    <button type="submit" class="btn-submit" id="submitBtn">
      <div class="spinner" id="spinner"></div>
      <span class="btn-text" id="btnText">Se connecter</span>
    </button>

  </form>

  <!-- Footer -->
  <p class="footer-note">Mémoire De Fin D'études Master 2026</p>
</div>

<script>
  const VALID_USERS = ['dounia', 'manel'];
  const VALID_PASS = 'master2026';

  function togglePassword() {
    const pw = document.getElementById('password');
    const btn = document.getElementById('togglePw');
    if (pw.type === 'password') {
      pw.type = 'text';
      btn.textContent = '🙈';
    } else {
      pw.type = 'password';
      btn.textContent = '👁';
    }
  }

  function setError(msg) {
    const card = document.getElementById('card');
    const errDiv = document.getElementById('errorMsg');
    const errText = document.getElementById('errorText');
    const uInput = document.getElementById('username');
    const pInput = document.getElementById('password');

    errText.textContent = msg;
    errDiv.classList.add('visible');
    uInput.classList.add('error-input');
    pInput.classList.add('error-input');

    // Shake animation — re-trigger by removing then adding class
    card.classList.remove('shake');
    void card.offsetWidth; // reflow
    card.classList.add('shake');
    card.addEventListener('animationend', () => card.classList.remove('shake'), { once: true });
  }

  function clearError() {
    document.getElementById('errorMsg').classList.remove('visible');
    document.getElementById('username').classList.remove('error-input');
    document.getElementById('password').classList.remove('error-input');
  }

  function handleLogin(e) {
    e.preventDefault();
    clearError();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');

    if (!username || !password) {
      setError('Veuillez remplir tous les champs.');
      return;
    }

    if (!VALID_USERS.includes(username) || password !== VALID_PASS) {
      setError('Identifiants incorrects. Veuillez réessayer.');
      return;
    }

    // Success — show spinner then redirect
    btn.classList.add('loading');
    btnText.textContent = 'Connexion en cours…';

    setTimeout(() => {
      btn.classList.remove('loading');
      btn.classList.add('success');
      btnText.textContent = '✓ Connecté';
      setTimeout(() => { window.location.href = '/'; }, 500);
    }, 900);
  }

  // Clear errors on typing
  document.getElementById('username').addEventListener('input', clearError);
  document.getElementById('password').addEventListener('input', clearError);
</script>
</body>
</html>
